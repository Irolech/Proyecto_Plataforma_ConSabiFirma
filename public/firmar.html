<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ConSabiFirma - Firma de Documento</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background: #ffeaa7;
            color: #d63031;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3436;
            margin: 0 0 10px 0;
            font-size: 1.7rem;
        }

        p {
            color: #636e72;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .doc-box {
            background: #f1f2f6;
            border-left: 5px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin: 25px 0;
            font-size: 0.95rem;
        }

        .btn-autofirma {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .btn-autofirma:hover {
            background: #27ae60;
        }

        #consolaLog {
            margin-top: 20px;
            padding: 12px;
            background: #2d3436;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: left;
            min-height: 40px;
            display: none;
            line-height: 1.4;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="status-badge">⏳ Pendiente de tu firma</span>
        <h1>Firma Electrónica de Documento</h1>
        <p>Al pulsar el botón se abrirá el cliente AutoFirma en tu equipo. Selecciona tu certificado digital para
            completar el proceso legal.</p>

        <div class="doc-box">
            <strong>📄 Documento:</strong> <span id="docNombre">Matrícula Escolar / Autorización de Traslado</span><br>
            <strong>ID de Trámite:</strong> <span id="docId">105</span><br>
            <strong>Fecha de Emisión:</strong> 2026-06-05
        </div>

        <button class="btn-autofirma" id="btnFirmar">
            🖊️ Firmar con Certificado (AutoFirma)
        </button>

        <div id="consolaLog"></div>
    </div>

    <script>
        const pdfOriginalBase64 = "JVBERi0xLjQKMSAwIG9iaik8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFI+PmVuZG9iagkyIDAgb2JqPDwvVHlwZS9QYWdlcy9LaWRzWzMgMCBSXS9Db3VudCAxPj5lbmRvYmozIDAgb2JqPDwvVHlwZS9QYWdlL1BhcmVudCAyIDAgUi9NZWRpYUJveFswIDAgNjEyIDc5Ml0+PmVuZG9iaiB0cmFpbGVyPDwvUm9vdCAxIDAgUj4+JQ==";

        document.getElementById('btnFirmar').addEventListener('click', () => {
            const consola = document.getElementById('consolaLog');
            consola.style.display = "block";
            consola.innerText = "⏳ Preparando envío seguro...";

            const documentoId = document.getElementById('docId').innerText;

            // El servidor donde AutoFirma hará el POST (usamos una URL limpia)
            const urlServer = encodeURIComponent(`http://localhost:3000/api/firmas/recibir?documentoId=${documentoId}`);

            // 🚀 CAMBIO CLAVE: No pasamos 'data' aquí porque es demasiado largo. 
            // Pasamos el Base64 mediante un formulario que AutoFirma lee de forma oculta si se configura bien,
            // pero para evitar el SAF_03, lo lanzaremos de forma simplificada:
            const afirmaUrl = `afirma://sign?algo=SHA256withRSA&format=PAdES&server=${urlServer}`;

            // Para evitar el error, si el Base64 es obligatorio, se inyecta vía POST, 
            // pero AutoFirma por protocolo simple espera que tú le des el archivo.
            // Si sigue fallando, es porque AutoFirma requiere que el POST sea explícito:

            window.location.href = afirmaUrl;
        });
    </script>
</body>

</html>
