<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ConSabiFirma - Firma de Documento Oficial</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background: #ffeaa7;
            color: #d63031;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3436;
            margin: 0 0 10px 0;
            font-size: 1.7rem;
        }

        p {
            color: #636e72;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .doc-box {
            background: #f1f2f6;
            border-left: 5px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin: 25px 0;
            font-size: 0.95rem;
        }

        .btn-autofirma {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .btn-autofirma:hover {
            background: #27ae60;
        }

        #consolaLog {
            margin-top: 20px;
            padding: 12px;
            background: #2d3436;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: left;
            min-height: 40px;
            display: none;
            line-height: 1.4;
            word-break: break-all;
        }
    </style>

    <script src="/js/autoscript.js"></script>
</head>

<body>

    <div class="card">
        <span class="status-badge">⏳ Pendiente de tu firma</span>
        <h1>Firma Electrónica de Documento</h1>
        <p>Al pulsar el botón se abrirá el cliente AutoFirma en tu equipo. Selecciona tu certificado digital para
            completar el proceso legal.</p>

        <div class="doc-box">
            <strong>📄 Documento:</strong> <span id="docNombre">Matrícula Escolar / Autorización de Traslado</span><br>
            <strong>ID de Trámite:</strong> <span id="docId">105</span><br>
            <strong>Fecha de Emisión:</strong> 2026-06-05
        </div>

        <button class="btn-autofirma" id="btnFirmar">
            🖊️ Firmar con Certificado (AutoFirma LTV)
        </button>

        <div id="consolaLog"></div>
    </div>

    <script>
        // Variable global donde guardaremos el PDF real en Base64
        let pdfDinamicoBase64 = "";

        // 1. Al cargar la página, pedimos el documento al servidor automáticamente
        window.addEventListener('DOMContentLoaded', () => {
            const consola = document.getElementById('consolaLog');
            consola.style.display = "block";
            consola.innerText = "⏳ Descargando documento desde el servidor...";

            fetch('/api/documento-prueba')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        pdfDinamicoBase64 = data.base64;
                        consola.style.color = "#2ecc71";
                        consola.innerText = "✅ Documento real cargado y listo para firmar.";
                    } else {
                        consola.style.color = "#e74c3c";
                        consola.innerText = "❌ Error del servidor: " + data.error;
                    }
                })
                .catch(err => {
                    consola.style.color = "#e74c3c";
                    consola.innerText = "❌ Error de red al intentar descargar el documento.";
                });
        });

        // 2. Evento principal del botón de firmar
        document.getElementById('btnFirmar').addEventListener('click', () => {
            const consola = document.getElementById('consolaLog');

            // Control de seguridad: Evitamos que el usuario firme si el PDF aún no ha cargado
            if (!pdfDinamicoBase64) {
                consola.style.color = "#e74c3c";
                consola.innerText = "⚠️ Por favor, espera a que el documento termine de cargar.";
                return;
            }

            consola.style.color = "#f1c40f";
            consola.innerText = "⏳ Inicializando motor de AutoFirma con perfil LTV...";

            const documentoId = document.getElementById('docId').innerText;

            try {
                // Arranca el túnel de WebSockets oculto entre el navegador y AutoFirma
                AutoScript.cargarAppAfirma();

                // 🚀 CONFIGURACIÓN LTV (Sello de tiempo y validación a largo plazo)
                const parametrosExtra =
                    "signatureProfile=PAdES-B-LTV\n" +
                    "tsType=RFC3161\n" +
                    "tsaURL=https://freetsa.org/tsr";

                // Lanzamos la petición de firma al motor ya encendido
                AutoScript.sign(
                    pdfDinamicoBase64,       // Documento original en Base64
                    "SHA256withRSA",         // Algoritmo de encriptación
                    "PAdES",                 // Formato de firma PDF
                    parametrosExtra,         // 🚀 Pasamos los parámetros LTV
                    function (firmaBase64) {
                        // EXITO: AutoFirma devuelve el PDF firmado
                        consola.style.color = "#2ecc71";
                        consola.innerText = "✅ ¡Documento firmado con LTV localmente! Enviando al servidor...";

                        // Enviamos el resultado a la base de datos
                        fetch(`/api/firmas/recibir?documentoId=${documentoId}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                archivoBase64: firmaBase64,
                                nombre: "Usuario Prueba",
                                cargo: "Desarrollador"
                            })
                        })
                            .then(res => res.json())
                            .then(data => {
                                if (data.success) {
                                    consola.innerText += "\n🚀 ¡Guardado en servidor con éxito!";
                                } else {
                                    consola.style.color = "#e74c3c";
                                    consola.innerText += "\n❌ Error en servidor: " + data.error;
                                }
                            })
                            .catch(err => {
                                consola.style.color = "#e74c3c";
                                consola.innerText += "\n❌ Error de red al enviar al servidor.";
                            });
                    },
                    function (errorType, errorMessage) {
                        // ERROR: Cancelación por parte del usuario o fallo interno
                        consola.style.color = "#e74c3c";
                        consola.innerText = `💥 Cancelado o error de AutoFirma: ${errorType} - ${errorMessage}`;
                    }
                );
            } catch (error) {
                // Fallo crítico al ejecutar el JS del ministerio
                consola.style.color = "#e74c3c";
                consola.innerText = "💥 Error al lanzar el script. Abre la consola (F12) para más detalles.";
                console.error(error);
            }
        });
    </script>
</body>

</html>
