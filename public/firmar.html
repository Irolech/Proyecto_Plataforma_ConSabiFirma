<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ConSabiFirma - Firma de Documentos</title>

    <!-- Dependencias de AutoFirma -->
    <script src="/js/base64.js"></script>
    <script src="/js/autoscript.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
            color: #333;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        #consolaLog {
            margin-top: 20px;
            padding: 12px;
            background: #1e293b;
            color: #38bdf8;
            font-family: monospace;
            border-radius: 6px;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Firma Digital de Expediente</h2>
        <p><strong>Identificador Documento:</strong> <span id="docId">DOC-2026-001</span></p>

        <button id="btnFirmar" class="btn-primary">Firmar Documento</button>

        <div id="consolaLog" style="display: none;"></div>
    </div>

    <script>
        let pdfDinamicoBase64 = "";

        // Inicialización del socket y precarga del documento al montar el DOM
        window.addEventListener('DOMContentLoaded', () => {
            const consola = document.getElementById('consolaLog');
            consola.style.display = "block";
            
            // Instanciar conexión WebSocket con AutoFirma una sola vez
            try {
                AutoScript.cargarAppAfirma();
                console.log("Motor AutoFirma inicializado correctamente.");
            } catch (error) {
                console.error("Error al pre-cargar AutoFirma:", error);
            }

            consola.innerText = "⏳ Descargando documento desde el servidor...";

            fetch('/api/documento-prueba')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        pdfDinamicoBase64 = data.base64;
                        consola.style.color = "#4ade80";
                        consola.innerText = "✅ Documento cargado y listo para procesar la firma.";
                    } else {
                        consola.style.color = "#f87171";
                        consola.innerText = "❌ Error del servidor: " + data.error;
                    }
                })
                .catch(err => {
                    consola.style.color = "#f87171";
                    consola.innerText = "❌ Error de red al solicitar el documento.";
                });
        });

        // Evento de firma
        document.getElementById('btnFirmar').addEventListener('click', () => {
            const consola = document.getElementById('consolaLog');

            if (!pdfDinamicoBase64) {
                consola.style.color = "#f87171";
                consola.innerText = "⚠️ Espera a que la carga del documento finalice.";
                return;
            }

            consola.style.color = "#facc15";
            consola.innerText = "⏳ Invocando AutoFirma cliente (PAdES-B-LTV)...";

            const documentoId = document.getElementById('docId').innerText;

            try {
                // Saneamiento de prefijo MIME si la cadena viene formateada desde jsPDF/backend
                const base64Limpio = pdfDinamicoBase64.replace(/^data:application\/pdf;base64,/, "");

                const parametrosExtra =
                    "signatureProfile=PAdES-B-LTV\n" +
                    "tsType=RFC3161\n" +
                    "tsaURL=https://freetsa.org/tsr";

                AutoScript.sign(
                    base64Limpio,            
                    "SHA256withRSA",         
                    "PAdES",                 
                    parametrosExtra,         
                    function (firmaBase64) {
                        consola.style.color = "#4ade80";
                        consola.innerText = "✅ Documento firmado localmente. Enviando a la API...";

                        fetch(`/api/firmas/recibir?documentoId=${documentoId}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                archivoBase64: firmaBase64,
                                nombre: "Usuario Autenticado",
                                cargo: "Firmante"
                            })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) {
                                consola.innerText += "\n🚀 Firma registrada correctamente en base de datos.";
                            } else {
                                consola.style.color = "#f87171";
                                consola.innerText += "\n❌ Rechazado por el servidor: " + data.error;
                            }
                        })
                        .catch(err => {
                            consola.style.color = "#f87171";
                            consola.innerText += "\n❌ Error de red al registrar la firma.";
                        });
                    },
                    function (errorType, errorMessage) {
                        consola.style.color = "#f87171";
                        consola.innerText = `💥 Firma cancelada o fallida: [${errorType}] ${errorMessage}`;
                    }
                );
            } catch (error) {
                consola.style.color = "#f87171";
                consola.innerText = "💥 Excepción capturada en ejecución JS. Revisa la consola (F12).";
                console.error("Detalle del error:", error);
            }
        });
    </script>
</body>
</html>
