        body {

            padding: 40px;
            display: flex;

            align-items: center;
            min-height: 80vh;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background: #ffeaa7;
            color: #d63031;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3436;
            margin: 0 0 10px 0;
            font-size: 1.7rem;
        }

        p {
            color: #636e72;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .doc-box {
            background: #f1f2f6;
            border-left: 5px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin: 25px 0;
            font-size: 0.95rem;
        }

        .btn-autofirma {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .btn-autofirma:hover {
            background: #27ae60;
        }

        #consolaLog {
            margin-top: 20px;
            padding: 12px;
            background: #2d3436;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: left;
            min-height: 40px;
            display: none;
            line-height: 1.4;
            word-break: break-all;
        }
    </style>

    <script src="/js/autoscript.js"></script>
</head>

                // Arranca el túnel de WebSockets oculto entre el navegador y tu ordenador
                AutoScript.cargarAppAfirma();

                // Ahora sí, lanzamos la petición de firma al motor ya encendido
                AutoScript.sign(
                    pdfOriginalBase64,
                    "SHA256withRSA",
                    "PAdES",
                    "", // Sin parámetros extra
                    function (firmaBase64) {
                        // EXITO: AutoFirma devuelve el PDF firmado
                        consola.style.color = "#2ecc71";
                        consola.innerText = "✅ ¡Documento firmado localmente! Enviando al servidor...";

                        fetch(`/api/firmas/recibir?documentoId=${documentoId}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                archivoBase64: firmaBase64,
                                nombre: "Sergio Perbech",
                                cargo: "Desarrollador"
                            })
                        })
                            .then(res => res.json())
                            .then(data => {
                                if (data.success) {
                                    consola.innerText += "\n🚀 ¡Guardado en servidor con éxito!";
                                } else {
                                    consola.style.color = "#e74c3c";
                                    consola.innerText += "\n❌ Error en servidor: " + data.error;
                                }
                            })
                            .catch(err => {
                                consola.style.color = "#e74c3c";
                                consola.innerText += "\n❌ Error de red al enviar al servidor.";
                            });
                    },
                    function (errorType, errorMessage) {
                        // ERROR: Cancelación o fallo interno
                        consola.style.color = "#e74c3c";
                        consola.innerText = `💥 Cancelado o error: ${errorType} - ${errorMessage}`;
                    }
                );
            } catch (error) {
                consola.style.color = "#e74c3c";
                consola.innerText = "💥 Error al lanzar el script. Abre la consola (F12) para más detalles.";
                console.error(error);
            }
        });
    </script>
</body>
