<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Firmas | Irolech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Registro de Firma</h1>
            <p>Por favor, firme dentro del recuadro para validar el documento.</p>
        </header>

        <main>
            <div class="signature-box">
                <canvas id="signature-pad"></canvas>
            </div>
            
            <div class="buttons">
                <button id="clear" class="btn-secondary">Limpiar</button>
                <button id="save" class="btn-primary">Enviar Firma</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
