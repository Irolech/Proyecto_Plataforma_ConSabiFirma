<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos | ConSabiFirma</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #004494;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .btn-descargar {
            background-color: #2e7d32;
            margin-top: 15px;
        }

        .btn-descargar:hover {
            background-color: #1b5e20;
        }

        /* 🎨 Ajuste de colores en la botonera inferior (Punto 1) */
        .flex-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* Nueva verificación pasa a ser azul corporativo */
        .btn-nueva {
            background-color: #0056b3;
        }

        .btn-nueva:hover {
            background-color: #004494;
        }

        /* Salir pasa a ser gris neutro */
        .btn-salir {
            background-color: #6c757d;
        }

        .btn-salir:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Servicio de Verificación de Integridad de Documentos</h2>

        <div id="seccion-busqueda">
            <p>Introduzca el Código Seguro de Verificación (CSV) impreso en el pié de su documento para comprobar su
                autenticidad.</p>
            <input type="text" id="csvInput" placeholder="SABI-XXXX-XXXX-XXXX" autocomplete="off">
            <button onclick="validarDocumento()">Verificar Documento</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const csvFromUrl = urlParams.get('csv');

            if (csvFromUrl) {
                document.getElementById('csvInput').value = csvFromUrl;
                validarDocumento();
            }
        });

        async function validarDocumento() {
            const csv = document.getElementById('csvInput').value.trim();
            const divResultado = document.getElementById('resultado');

            if (!csv) {
                mostrarMensaje('Por favor, introduzca un código CSV válido.', 'error');
                return;
            }

            divResultado.style.display = 'none';

            try {
                const response = await fetch(`/api/validacion/consultar/${csv}`);
                const data = await response.json();

                if (data.success) {
                    const doc = data.documento;

                    document.getElementById('seccion-busqueda').style.display = 'none';

                    const htmlExito = `
                        <div style="text-align: left; margin-bottom: 15px;">
                            <div style="text-align: center; margin-bottom: 20px; font-size: 16px;">
                                <strong>✅ El documento existe</strong>
                            </div>
                            <div style="margin-bottom: 12px;">
                                <strong>Documento:</strong><br>
                                <span style="color: #333;">${doc.nombre || 'Sin título'}</span>
                            </div>
                            <div>
                                <strong>Firmado por:</strong><br>
                                <span style="color: #333; line-height: 1.5;">${renderFirmantes(doc.firmantes)}</span>
                            </div>
                        </div>
                        
                        <button class="btn-descargar" onclick="window.location.href='/api/validacion/descargar/${csv}'">
                            📄 Descargar Copia Auténtica
                        </button>
                        
                        <div class="flex-container">
                            <button class="btn-nueva" onclick="nuevaVerificacion()">🔄 Nueva verificación</button>
                            <button class="btn-salir" onclick="salirPortal()">🚪 Salir</button>
                        </div>
                    `;
                    mostrarMensaje(htmlExito, 'success');
                } else {
                    mostrarMensaje('❌ El documento no existe', 'error');
                }
            } catch (error) {
                mostrarMensaje('❌ Error de conexión con el servidor. Inténtelo más tarde.', 'error');
            }
        }

        function renderFirmantes(firmantes) {
            if (!firmantes || firmantes.length === 0) {
                return 'No constan firmantes efectivos en el registro de este documento.';
            }

            if (Array.isArray(firmantes)) {
                return firmantes.map(f => {
                    if (typeof f === 'object' && f !== null) {
                        const puesto = f.cargo || '';
                        const parentesisPuesto = puesto ? ` (<em>${puesto}</em>)` : '';

                        // Si la consulta tuviera apellidos separados los formatea, 
                        // si no (como ocurre en firmas_documentos), pinta el nombre directamente sin comas iniciales
                        if (f.apellidos) {
                            return `${f.apellidos}, ${f.nombre}${parentesisPuesto}`.trim();
                        }
                        return `${f.nombre}${parentesisPuesto}`.trim();
                    }
                    return String(f).trim();
                }).join('<br>');
            }

            if (typeof firmantes === 'string') {
                return firmantes.split('\n').map(linea => linea.trim()).join('<br>');
            }

            return String(firmantes);
        }

        function nuevaVerificacion() {
            document.getElementById('seccion-busqueda').style.display = 'block';
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('csvInput').value = '';
            document.getElementById('csvInput').focus();

            if (window.history.pushState) {
                const urlLimpia = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.pushState({ path: urlLimpia }, '', urlLimpia);
            }
        }

        function salirPortal() {
            window.close();
            setTimeout(() => {
                window.location.href = '/';
            }, 150);
        }

        function mostrarMensaje(html, tipo) {
            const div = document.getElementById('resultado');
            div.innerHTML = html;
            div.className = tipo;
            div.style.display = 'block';
        }
    </script>

</body>

</html>
