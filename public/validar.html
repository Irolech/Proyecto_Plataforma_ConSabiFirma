<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos | ConSabiFirma</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #004494;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .btn-descargar {
            background-color: #2e7d32;
            margin-top: 15px;
        }

        .btn-descargar:hover {
            background-color: #1b5e20;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Servicio de Verificación de Integridad de Documentos</h2>
        <p>Introduzca el Código Seguro de Verificación (CSV) impreso en el pié de su documento para comprobar su
            autenticidad.</p>

        <input type="text" id="csvInput" placeholder="SABI-XXXX-XXXX-XXXX" autocomplete="off">
        <button onclick="validarDocumento()">Verificar Documento</button>

        <div id="resultado"></div>
    </div>

    <script>
        // 🚀 NUEVA LÓGICA: Auto-detección al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const csvFromUrl = urlParams.get('csv');

            if (csvFromUrl) {
                // Rellenamos el input y lanzamos la validación automáticamente
                document.getElementById('csvInput').value = csvFromUrl;
                validarDocumento();
            }
        });

        async function validarDocumento() {
            const csv = document.getElementById('csvInput').value.trim();
            const divResultado = document.getElementById('resultado');

            if (!csv) {
                mostrarMensaje('Por favor, introduzca un código CSV válido.', 'error');
                return;
            }

            divResultado.style.display = 'none';

            try {
                const response = await fetch(`/api/validacion/consultar/${csv}`);
                const data = await response.json();

                if (data.success) {
                    const doc = data.documento;
                    const htmlExito = `
                        <strong>✅ Documento Íntegro y Válido</strong><br><br>
                        <strong>Trámite:</strong> ${doc.nombre}<br>
                        <strong>Estado:</strong> ${doc.estado.toUpperCase()}<br>
                        <button class="btn-descargar" onclick="window.location.href='/api/validacion/descargar/${csv}'">
                            📄 Descargar Copia Auténtica
                        </button>
                    `;
                    mostrarMensaje(htmlExito, 'success');
                } else {
                    mostrarMensaje('❌ ' + data.error, 'error');
                }
            } catch (error) {
                mostrarMensaje('❌ Error de conexión con el servidor. Inténtelo más tarde.', 'error');
            }
        }

        function mostrarMensaje(html, tipo) {
            const div = document.getElementById('resultado');
            div.innerHTML = html;
            div.className = tipo;
            div.style.display = 'block';
        }
    </script>

</body>

</html>
